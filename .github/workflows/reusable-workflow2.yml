name: Reusable Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

    secrets:
      aws-role-arn:
        required: true

jobs:
  deploy:
    runs-on: [self-hosted, linux]

    environment: ${{ inputs.environment }}

    steps:
      # GitHub Actions 不会自动 checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # YAML 只负责编排，真正 deploy logic 放在 Makefile
      - name: Deploy
        run: make deploy ENV=${{ inputs.environment }}