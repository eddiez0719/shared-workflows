on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
    secrets:
      aws-role-arn:
        required: true
        type: string
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ap-southeast-2
      - name: Run to depoly
        run: make deploy env=${{ inputs.env }}